kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  # The default network plugin of kind connects each Pod to the node with a point-to-point link. A virtual machine
  # that takes over the address of its Pod, as the operator configures it, then believes that the other Pods are on
  # its own link and cannot answer them. Calico is installed instead, which gives each Pod a host route only.
  disableDefaultCNI: true
  podSubnet: 192.168.0.0/16
