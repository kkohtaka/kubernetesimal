apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: widgets.example.com
spec:
  group: example.com
  scope: Cluster
  names: {kind: Widget, plural: widgets}
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [size, name]
              properties:
                size: {type: integer, minimum: 1, maximum: 5}
                color: {type: string, enum: [red, blue]}
                name: {type: string, pattern: "^[a-z]+$"}
                weight: {type: string}
                added: {type: string}
                labels:
                  type: object
                  additionalProperties: {type: integer}
                parts:
                  type: array
                  items:
                    type: object
                    properties:
                      id: {type: string, enum: [a]}
