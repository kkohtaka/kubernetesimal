apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: gadgets.example.com
spec:
  group: example.com
  scope: Namespaced
  names: {kind: Gadget, plural: gadgets}
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [size]
              properties:
                size: {type: integer, minimum: 0, maximum: 10}
                color: {type: string, enum: [red, green]}
                name: {type: string}
                weight: {type: integer}
                legacy: {type: string}
                labels:
                  type: object
                  additionalProperties: {type: string}
                parts:
                  type: array
                  items:
                    type: object
                    properties:
                      id: {type: string}
                      note: {type: string}
    - name: v1alpha0
      served: true
      storage: false
      schema:
        openAPIV3Schema: {type: object}
