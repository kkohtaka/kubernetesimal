kind: Changed
body: The API server gives an Etcd object its default version, 3.5.1, and its default of one replica, and rejects invalid objects, also while the operator is not running. An Etcd object is now rejected when spec.replicas is less than 1, when spec.version is not of the form MAJOR.MINOR.PATCH, or when spec.imagePersistentVolumeClaimRef.name is missing or empty. Zero replicas and versions with a suffix, such as 3.6.0-rc.1, were accepted before.
