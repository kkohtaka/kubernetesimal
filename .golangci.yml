version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - dupword
    - errorlint
    - forbidigo
    - gocritic
    - gocyclo
    - gosec
    - misspell
    - nakedret
    - nilerr
    - nolintlint
    - revive
    - unconvert
    - unparam
  settings:
    forbidigo:
      forbid:
        - pattern: ^(F|P|X)(Describe|Context|When|It|Specify|Entry|DescribeTable)$
          msg: Focused and pending specs must not be committed. Every spec has to run.
        - pattern: ^(Skip|\w+\.Skip|\w+\.Skipf|\w+\.SkipNow)$
          msg: Tests must not be skipped. Fix the test, or report why it cannot run.
    gocyclo:
      min-complexity: 20
    nolintlint:
      # Every suppression must name the linter and explain why.
      require-explanation: true
      require-specific: true
    revive:
      rules:
        - name: dot-imports
          arguments:
            - allowed-packages:
                - github.com/onsi/ginkgo
                - github.com/onsi/gomega
  exclusions:
    generated: strict
    presets:
      - comments
      - std-error-handling

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/kkohtaka/kubernetesimal
  exclusions:
    generated: strict

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
