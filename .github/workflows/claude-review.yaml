name: claude-review

# An independent agent reviews every pull request against the specification. It did not write the change and does
# not see the conversation that produced it, so it does not share the author's assumptions. Its review is advice for
# the human who merges. It does not approve or block.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Review against the specification

    # Secrets are not available to pull requests from Dependabot, and its changes implement no specification.
    if: ${{ !github.event.pull_request.draft && github.actor != 'dependabot[bot]' }}

    runs-on: ubuntu-24.04

    # The token that pays for the review lives in this environment, which requires a reviewer to approve each run.
    # A run therefore waits until the owner releases it, and nothing in a pull request can reach the token before.
    environment: claude-review

    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

    steps:
      - name: Explain why the review is skipped
        if: ${{ env.CLAUDE_CODE_OAUTH_TOKEN == '' }}
        run: |
          echo "::notice::The claude-review environment has no CLAUDE_CODE_OAUTH_TOKEN secret, so the review is skipped."
      - uses: actions/checkout@v7
        if: ${{ env.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        with:
          # The full history is needed to compare with the base branch.
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        if: ${{ env.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The action refuses runs that a bot started, unless the bot is named here. Pull requests of this project
          # are opened by the owner's GitHub App. Other bots stay refused.
          allowed_bots: kkohtaka-ccbot
          claude_args: |
            --max-turns 60
            --allowedTools "Read,Grep,Glob,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),mcp__github_inline_comment__create_inline_comment"
          prompt: |
            You are reviewing pull request #${{ github.event.pull_request.number }} in ${{ github.repository }}.
            The base branch is origin/${{ github.event.pull_request.base.ref }}.

            In this project no human reads implementation code line by line. A human reviews the specification and
            the evidence that it is met, and relies on you to tell them whether that evidence is real. You did not
            write this change. Do not trust what the pull request description claims: check it against the code.

            Read CLAUDE.md and docs/specs/README.md first. Then read the pull request with `gh pr view` and
            `gh pr diff`, and read the surrounding code as needed. Do not review style, naming, or formatting;
            linters cover those.

            Answer these questions.

            1. Which specification does the change implement? Look at the description, at changed files under
               docs/specs, and at requirement identifiers such as [ETCD-012] in the tests. If the change alters
               behavior and no specification covers it, that is a finding. Maintenance that does not change
               behavior needs no specification.
            2. For every requirement that a new or changed test claims: does the test really verify the
               requirement as written? Read the requirement, then the test. Look for assertions that are weaker
               than the requirement, tests that would pass without the implementation, tests that only exercise
               the successful path of a requirement that also covers failure, and claims on tests that never reach
               the behavior.
            3. Does the implementation do anything observable that no requirement asks for, or leave out something
               a requirement asks for?
            4. Were any guarantees weakened? Deleted or loosened tests, lint suppressions, changes to
               .golangci.yml, to the thresholds and exclusions in the Makefile, to the checkers under hack/, to
               .github/, .claude/, CLAUDE.md, or CODEOWNERS.
            5. Do the changes under api/, config/crd/, config/rbac/, and config/webhook/ match what the
               specification and the description say? Name every new permission and every incompatible API change.
            6. Is the description honest? Compare its "Evidence", "Changes that need a human review", and "Not
               verified" sections with what you found.

            Report as follows.

            - Post each concrete finding as an inline comment on the line it concerns, with
              mcp__github_inline_comment__create_inline_comment. Say what is wrong and what would make it right.
              Do not post praise or restate what the code does.
            - Then post exactly one summary with
              `gh pr comment ${{ github.event.pull_request.number }} --edit-last --create-if-none --body "<text>"`,
              so that a new push updates your earlier summary instead of adding another one.
            - Structure the summary like this:

              ## Review against the specification

              **Verdict:** one of "Evidence holds", "Evidence has gaps", or "Evidence does not hold", followed by
              one sentence.

              | Requirement | Test | Verified? |
              |---|---|---|
              One row per requirement that the change claims. "Verified?" is "Yes", "Weak: <why>", or "No: <why>".
              Leave the table out when the change claims no requirements.

              ### Findings
              The findings from questions 1 to 6, most important first. Write "None" if there are none.

              ### What a human should look at
              The API, permission, and guardrail changes in plain words, and anything you could not judge.

            - Write in English. Be specific and brief. If you are not sure about a finding, say so instead of
              leaving it out.
            - You can read the repository and comment on the pull request. Do not try to change files, push,
              approve, or merge.
