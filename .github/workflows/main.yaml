name: main

on:
  push: {}
  pull_request: {}

jobs:
  test:
    name: Run tests

    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          # The full history is needed to find the merge base with the main branch.
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make test
      - name: Check that generated files are up to date
        run: git diff --exit-code
      - name: Check that requirements are traceable to tests
        run: |
          set -o pipefail
          make --no-print-directory -s spec-check | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Check that changed code is covered by tests
        run: |
          set -o pipefail
          make --no-print-directory -s cover-check | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Check that the API has no unacknowledged incompatible changes
        run: |
          set -o pipefail
          make --no-print-directory -s api-check | tee -a "$GITHUB_STEP_SUMMARY"

  lint:
    name: Run linters

    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          # The full history is needed to find the merge base with the main branch.
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make lint

  vulnerabilities:
    name: Check for known vulnerabilities

    runs-on: ubuntu-24.04

    # The dependencies are outdated and have known vulnerabilities. This job reports them without failing the
    # workflow until the dependencies are updated. Remove the next line then.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make vuln-check

  build:
    name: Build a Docker image

    needs:
      - test
      - lint

    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write

    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        if: ${{ env.PUBLISH == 'true' }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ env.PUBLISH == 'true' }}
          tags: ghcr.io/kkohtaka/kubernetesimal/kubernetesimal:latest
