name: main

on:
  push: {}
  pull_request: {}

jobs:
  test:
    name: Run tests

    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make test
      - name: Check that generated files are up to date
        run: git diff --exit-code

  lint:
    name: Run linters

    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          # The full history is needed to find the merge base with the main branch.
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make lint

  build:
    name: Build a Docker image

    needs:
      - test
      - lint

    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write

    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        if: ${{ env.PUBLISH == 'true' }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ env.PUBLISH == 'true' }}
          tags: ghcr.io/kkohtaka/kubernetesimal/kubernetesimal:latest
