name: main

# Branches are checked through their pull request. Running on every push as well would run everything twice.
on:
  push:
    branches:
      - main
  pull_request:
    # Labeling re-runs the checks, so that the skip-changelog label takes effect.
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  test:
    name: Run tests

    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7
        with:
          # The full history is needed to find the merge base with the main branch.
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make test
      - name: Check that generated files are up to date
        run: git diff --exit-code
      - name: Check that requirements are traceable to tests
        run: |
          set -o pipefail
          make --no-print-directory -s spec-check | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Check that changed code is covered by tests
        run: |
          set -o pipefail
          make --no-print-directory -s cover-check | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Check that the API has no unacknowledged incompatible changes
        run: |
          set -o pipefail
          make --no-print-directory -s api-check | tee -a "$GITHUB_STEP_SUMMARY"
      # A person exempts a pull request that changes nothing for users by labeling it.
      - name: Check that a change to what users get comes with a change file
        if: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'skip-changelog') }}
        run: make --no-print-directory -s change-check

  lint:
    name: Run linters

    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7
        with:
          # The full history is needed to find the merge base with the main branch.
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make lint

  vulnerabilities:
    name: Check for known vulnerabilities

    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The dependencies are outdated and have known vulnerabilities. Until they are updated, this job reports them
      # as a warning and in the job summary instead of failing. To make it fail again, replace the two steps below
      # with a single "run: make vuln-check".
      - name: Check for known vulnerabilities
        id: check
        continue-on-error: true
        run: |
          set -o pipefail
          make --no-print-directory -s vuln-check | tee vuln.txt
      - name: Report the vulnerabilities
        if: ${{ steps.check.outcome == 'failure' }}
        run: |
          echo "::warning::Known vulnerabilities are reachable. See the job summary. This does not fail the build yet."
          {
            echo "## Known vulnerabilities"
            echo
            echo '```'
            grep -E '^Vulnerability #|Found in:|Fixed in:|^Your code is affected' vuln.txt || cat vuln.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  e2e:
    name: Run end-to-end tests

    runs-on: ubuntu-24.04

    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The runners offer hardware virtualization, but not to the user that the job runs as. See ADR 0003.
      - name: Make /dev/kvm usable
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Create a cluster with KubeVirt
        run: hack/e2e/cluster.sh
      - name: Install the operator
        run: make e2e E2E_RUN='^TestInstall$'
      # These tests read what the operator did during the whole run, so they come after everything else.
      - name: Check what the operator did
        run: make e2e E2E_RUN='^(TestMetricsAreNotExposed|TestNoTraces)$'
      - name: Collect diagnostics
        if: ${{ failure() }}
        run: |
          section() { echo; echo "::group::$1"; }
          section "Nodes and Pods"
          kubectl get nodes -o wide || true
          kubectl get pods -A -o wide || true
          echo "::endgroup::"
          section "Operator"
          kubectl -n kubernetesimal describe deployment,pods || true
          # The probers log several lines every few seconds while etcd is not up, which buries everything else.
          kubectl -n kubernetesimal logs deployment/kubernetesimal-controller-manager --all-containers --tail=-1 \
            | grep -v -e etcd-client -e etcd-prober -e etcdnode-prober -e '^\s' | cut -c1-600 | tail -n 300 || true
          echo "::endgroup::"
          section "Objects of the operator"
          kubectl get etcd,etcdnodedeployment,etcdnodeset,etcdnode -A -o yaml || true
          echo "::endgroup::"
          section "Events"
          kubectl get events -A --sort-by=.lastTimestamp | tail -n 150 || true
          echo "::endgroup::"

  build:
    name: Build a Docker image

    needs:
      - test
      - lint

    runs-on: ubuntu-24.04

    # The image is only built here, to show that it still builds. Images are published by the release workflow.
    steps:
      - uses: actions/checkout@v7
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
