name: release

# Step two of a release: when a new version appears in the changelog on the main branch, publish it. That is the
# container image, the install manifests, a tag, and a GitHub release with the notes of that version. A version that
# already has a tag is left alone, so the workflow is safe to run again. See docs/releasing.md.

on:
  push:
    branches:
      - main
    paths:
      - CHANGELOG.md
      - .changes/v*.md

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Publish a release

    runs-on: ubuntu-24.04

    permissions:
      contents: write
      packages: write

    env:
      IMAGE: ghcr.io/kkohtaka/kubernetesimal/kubernetesimal
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v7
      - name: Find the version to release
        id: version
        run: |
          version=$(find .changes -maxdepth 1 -name 'v*.md' -printf '%f\n' | sed 's/\.md$//' | sort --version-sort | tail -n 1)
          if [ -z "${version}" ]; then
            echo "The changelog has no version yet."
            exit 0
          fi
          if gh release view "${version}" > /dev/null 2>&1 || git ls-remote --exit-code --tags origin "refs/tags/${version}" > /dev/null; then
            echo "${version} is already released."
            exit 0
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        if: ${{ steps.version.outputs.version != '' }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The image is published before the release, so that a release never refers to an image that does not exist.
      - uses: docker/build-push-action@v7
        if: ${{ steps.version.outputs.version != '' }}
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE }}:latest
      - name: Publish the release
        if: ${{ steps.version.outputs.version != '' }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          make --no-print-directory -s release-manifest VERSION="${VERSION}" > install.yaml
          gh release create "${VERSION}" install.yaml \
            --target "${GITHUB_SHA}" \
            --title "${VERSION}" \
            --notes-file ".changes/${VERSION}.md"
